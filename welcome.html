<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Never get lost on the FUTA campus again. 475+ places, turn-by-turn walking, free.">
<title>Maps By FUTA – Never get lost on campus again</title>
<meta name="theme-color" content="#0b1326">
<link rel="canonical" href="https://mapsbyfuta.xyz/welcome">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Maps By FUTA">
<meta property="og:title" content="Never get lost at FUTA again">
<meta property="og:description" content="475+ places. Turn-by-turn walking. Free, no download. Built by students, for students.">
<meta property="og:url" content="https://mapsbyfuta.xyz/welcome">
<meta property="og:image" content="https://mapsbyfuta.xyz/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#0b1326;--ink:#f4f1ff;--muted:#b9b6d6;--violet:#7c3aed;--soft:#a78bfa;--cyan:#44e2cd;--amber:#ffb95f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
.stage{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:72px 22px 48px;text-align:center;isolation:isolate}
.stage::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 50% at 50% 38%,rgba(124,58,237,.34),transparent 70%),radial-gradient(40% 35% at 85% 90%,rgba(68,226,205,.14),transparent 70%)}
.map{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
.map g{fill:none;stroke:#b98cff;stroke-opacity:.14;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:drift 120s linear infinite}
.map #c2{animation-direction:reverse;animation-duration:150s}
@keyframes drift{to{transform:rotate(360deg)}}
.bp{position:fixed;width:26px;height:38px;opacity:.55;z-index:-1;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:22px;display:flex;align-items:center;gap:10px;font:700 17px 'Bricolage Grotesque',sans-serif}
.brand svg{width:20px;height:28px}
#skip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;min-height:44px;padding:0 14px;background:none;border:0;color:var(--muted);font:500 14px Inter,sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
#skip:focus-visible{outline:2px solid var(--cyan);border-radius:8px}
h1{margin:0;min-height:2.3em;max-width:16ch;font:800 clamp(38px,8.5vw,84px)/1.04 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center}
.caret{display:inline-block;width:.07em;height:.9em;margin-left:.06em;background:var(--cyan);animation:blink 1s steps(1) infinite;vertical-align:-.08em}
@keyframes blink{50%{opacity:0}}
#sub{margin:0;min-height:1.6em;max-width:36ch;font-size:clamp(16px,3.6vw,21px);line-height:1.5;color:var(--muted)}
.cta{display:flex;flex-direction:column;align-items:center;gap:16px;transition:opacity .9s,transform .9s}
.cta.pre{opacity:0;transform:translateY(18px);visibility:hidden;pointer-events:none}
#go{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:14px;width:min(88vw,540px);min-height:84px;border-radius:999px;background:linear-gradient(120deg,#7c3aed,#6d28d9);color:#fff;font:800 clamp(20px,4.8vw,26px) 'Bricolage Grotesque',sans-serif;text-decoration:none;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 20px 70px rgba(124,58,237,.6);transition:transform .3s,box-shadow .3s}
#go::after{content:"";position:absolute;inset:-5px;border-radius:999px;border:2px solid var(--cyan);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.97);opacity:.8}100%{transform:scale(1.14,1.55);opacity:0}}
#go:hover{transform:translateY(-3px) scale(1.02)}
#go:focus-visible{outline:3px solid var(--cyan);outline-offset:7px}
#go svg{width:26px;height:26px;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
#go.busy{transform:scale(1.06);box-shadow:0 0 120px rgba(124,58,237,.9)}
#go.busy::after,#go.busy svg{animation:none}
.trust{margin:0;font-size:14px;color:var(--muted)}
.trust b{color:var(--ink);font-weight:600}
.fine{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;font-size:12px;color:#8f8db3}
.fade{transition:opacity .5s,transform .5s,filter .5s}
.leaving .fade{opacity:0;transform:scale(.95);filter:blur(8px)}
#ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(70% 60% at 50% 45%,#2a1660,#0b1326 75%);clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path 1s cubic-bezier(.7,0,.2,1);pointer-events:none;visibility:hidden}
#ov.on{clip-path:circle(150vmax at var(--x,50%) var(--y,50%));visibility:visible;pointer-events:auto}
#ov svg.scene{width:min(94vw,900px);height:auto;transition:transform .8s cubic-bezier(.5,0,.2,1),opacity .7s}
#ov.zoom svg.scene{transform:scale(1.7);opacity:0}
#ov.zoom #cap2{opacity:0}
#cap2{margin:0;font:700 clamp(20px,4.5vw,30px) 'Bricolage Grotesque',sans-serif;transition:opacity .5s;min-height:1.3em}
.compass{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);right:20px;width:64px;height:64px}
.needle{transform-origin:32px 32px;animation:spin 2.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes spin{from{transform:rotate(-540deg)}to{transform:rotate(45deg)}}
#pin{opacity:0;transform:translateY(-80px)}
#pin.drop{animation:drop .6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes drop{to{opacity:1;transform:translateY(0)}}
.rip{fill:none;stroke:var(--cyan);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
#pin.drop~.rip{animation:rip 1.1s ease-out .35s}
@keyframes rip{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(3)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg class="map" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g id="c1"></g><g id="c2"></g></svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="pinsym" viewBox="0 0 44 64"><path d="M22 62C8 44 0 34 0 22a22 22 0 1144 0c0 12-8 22-22 40z" fill="currentColor"/><circle cx="22" cy="22" r="8" fill="#0b1326"/></symbol></svg>
<svg class="bp" style="top:16%;left:9%;color:#44e2cd" aria-hidden="true"><use href="#pinsym"/></svg>
<svg class="bp" style="top:70%;left:14%;color:#ffb95f;animation-delay:-2s" aria-hidden="true"><use href="#pinsym"/></svg>
<svg class="bp" style="top:22%;right:11%;color:#a78bfa;animation-delay:-1s" aria-hidden="true"><use href="#pinsym"/></svg>
<svg class="bp" style="top:64%;right:8%;color:#44e2cd;animation-delay:-3s" aria-hidden="true"><use href="#pinsym"/></svg>

<main class="stage">
<div class="brand fade"><svg viewBox="0 0 44 64" style="color:#a78bfa" aria-hidden="true"><use href="#pinsym"/></svg>Maps By FUTA</div>
<button id="skip" type="button">Skip intro</button>
<h1 class="fade" aria-label="Never get lost at FUTA again."><span id="tw" aria-hidden="true">Never get lost at FUTA again.</span><span class="caret" aria-hidden="true"></span></h1>
<p id="sub" class="fade">475+ places. Turn-by-turn walking. Free, no download.</p>
<div class="cta">
<a id="go" href="/map"><span class="lb">Start your adventure</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<p class="trust fade"><b>Built by students, for students.</b> Join in seconds.</p>
</div>
<p class="fine fade">An independent student project, not an official FUTA product.</p>
</main>

<div id="ov" aria-hidden="true">
<svg class="compass" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="none" stroke="#a78bfa" stroke-opacity=".6" stroke-width="2"/><g class="needle"><path d="M32 8l6 24H26z" fill="#44e2cd"/><path d="M32 56l-6-24h12z" fill="#a78bfa"/></g></svg>
<svg class="scene" viewBox="0 0 800 500">
<path d="M110 400C220 430 260 260 380 300S520 380 560 220 640 140 680 110" fill="none" stroke="#b9b6d6" stroke-opacity=".45" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 14"/>
<path id="route" d="M110 400C220 430 260 260 380 300S520 380 560 220 640 140 680 110" fill="none" stroke="#44e2cd" stroke-width="5" stroke-linecap="round" style="filter:drop-shadow(0 0 8px #44e2cd)"/>
<circle cx="110" cy="400" r="9" fill="#ffb95f"/><circle cx="110" cy="400" r="18" fill="none" stroke="#ffb95f" stroke-opacity=".5"/>
<g transform="translate(680 110)"><g id="pin" style="color:#a78bfa"><g transform="translate(-22 -62)"><use href="#pinsym" width="44" height="64"/></g></g><circle class="rip" r="16"/></g>
<g id="walker"><circle r="10" fill="#fff"/><circle r="18" fill="#fff" fill-opacity=".2"/></g>
</svg>
<p id="cap2">Charting your route…</p>
</div>

<script>
(function(){
var URL_='/map'; /* no dedicated sign-up route exists yet; the sign-up form is a tab in the modal on /map */
var $=function(s){return document.querySelector(s)};
var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
var NS='http://www.w3.org/2000/svg';
function contours(g,cx,cy,n,s){for(var i=0;i<n;i++){var r=50+i*34,d='';for(var k=0;k<=90;k++){var t=k/90*6.2832,rr=r*(1+.09*Math.sin(3*t+i*.5+s)+.05*Math.sin(5*t-i*.7+2*s));d+=(k?'L':'M')+(cx+rr*Math.cos(t)*1.25).toFixed(1)+' '+(cy+rr*Math.sin(t)).toFixed(1)}var p=document.createElementNS(NS,'path');p.setAttribute('d',d+'Z');g.appendChild(p)}}
contours($('#c1'),260,720,16,1);contours($('#c2'),1200,170,14,4);

var hooks=['First day at FUTA?','Lost between lecture halls?','Late for a class you can\u2019t find?'];
var H='Never get lost at FUTA again.',S='475+ places. Turn-by-turn walking. Free, no download.';
var tw=$('#tw'),sub=$('#sub'),cta=$('.cta'),sk=$('#skip'),stop=rm;
function sleep(ms){return new Promise(function(r){setTimeout(r,stop?0:ms)})}
async function type(el,t,sp){for(var i=0;i<t.length;i++){if(stop)break;el.textContent+=t[i];await sleep(sp+Math.random()*24)}}
async function erase(el,sp){while(el.textContent&&!stop){el.textContent=el.textContent.slice(0,-1);await sleep(sp)}}
async function run(){
  cta.classList.add('pre');tw.textContent='';sub.textContent='';
  for(var i=0;i<hooks.length&&!stop;i++){await type(tw,hooks[i],42);await sleep(950);await erase(tw,16);await sleep(150)}
  tw.textContent='';await type(tw,H,46);await sleep(250);await type(sub,S,18);
  tw.textContent=H;sub.textContent=S;sk.hidden=true;await sleep(300);cta.classList.remove('pre');
}
sk.addEventListener('click',function(){stop=true});
run();

var go=$('#go'),ov=$('#ov'),route=$('#route'),walker=$('#walker'),pin=$('#pin'),cap=$('#cap2');
go.addEventListener('click',function(e){
  if(rm||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button)return;
  e.preventDefault();if(go.classList.contains('busy'))return;
  var b=go.getBoundingClientRect();
  ov.style.setProperty('--x',(b.left+b.width/2)+'px');ov.style.setProperty('--y',(b.top+b.height/2)+'px');
  document.body.classList.add('leaving');go.classList.add('busy');go.querySelector('.lb').textContent='Charting your route\u2026';
  setTimeout(function(){ov.classList.add('on');setTimeout(draw,700)},350);
});
function draw(){
  var L=route.getTotalLength(),t0=performance.now(),D=2300;
  route.style.strokeDasharray=L;route.style.strokeDashoffset=L;
  setTimeout(function(){cap.textContent='Spotting shortcuts\u2026'},1000);
  requestAnimationFrame(function f(t){
    var p=Math.min((t-t0)/D,1),e=1-Math.pow(1-p,3),pt=route.getPointAtLength(L*e);
    route.style.strokeDashoffset=L*(1-e);walker.setAttribute('transform','translate('+pt.x+' '+pt.y+')');
    if(p<1)requestAnimationFrame(f);else arrive();
  });
}
function arrive(){
  pin.classList.add('drop');cap.textContent='You\u2019re on the map.';
  setTimeout(function(){ov.classList.add('zoom')},700);
  setTimeout(function(){location.href=URL_},1450);
}
})();
</script>
</body>
</html>
